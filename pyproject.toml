[project]
name = "stock-trading"
version = "0.1.0"
description = "台灣股票交易程式化系統"
authors = [
    { name = "cookeyholder", email = "cookeyholder@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "pyupgrade>=3.15.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0",
    "ipykernel>=6.25.0",
    "notebook>=7.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["you"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
