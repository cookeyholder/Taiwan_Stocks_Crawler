name: CI Check

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: read

jobs:
  # ─── Rust 檢查與測試 ───
  rust-ci:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Cargo Cache
        uses: swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Auto-fix Clippy warnings
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: Run Clippy Check (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit Auto-fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: [skip ci] auto fix clippy warnings"
          file_pattern: "**/*.rs"
          branch: ${{ github.head_ref }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Run Cargo Tests
        run: cargo test --all-targets --workspace

  # ─── 前端 Vue & TS 檢查與測試 ───
  frontend-ci:
    name: Frontend Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock-tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx vue-tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Run Frontend Tests
        run: npm run test
