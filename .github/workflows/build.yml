name: Build Executable

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install pyinstaller

      - name: Build executable
        run: |
          uv run pyinstaller build/stock_screener.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock_screener-linux
          path: dist/stock_screener/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install pyinstaller

      - name: Build executable
        run: |
          uv run pyinstaller build/stock_screener.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock_screener-windows
          path: dist/stock_screener/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stock_screener-linux
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: stock_screener-windows
          path: release/windows

      - name: Package artifacts
        run: |
          cd release
          tar czf stock_screener-linux.tar.gz linux/
          zip -r stock_screener-windows.zip windows/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/stock_screener-linux.tar.gz
            release/stock_screener-windows.zip
          generate_release_notes: true
